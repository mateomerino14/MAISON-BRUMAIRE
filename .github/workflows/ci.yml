name: Integración continua

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sitio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipado
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Compilación
        run: npm run build

